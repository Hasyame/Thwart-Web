<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thwart — Marvel Champions card browser</title>
    <meta
      name="description"
      content="Search the Marvel Champions card database in English and French. An unofficial companion to the Thwart Android app."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛡️</text></svg>" />
    <!--
      Card images are referenced from MarvelCDB at their canonical URLs and are
      never copied here. Warming the connection early keeps the first card view
      from paying for a fresh TLS handshake.
    -->
    <link rel="preconnect" href="https://marvelcdb.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
