<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is load-bearing on iOS: without it every
      env(safe-area-inset-*) resolves to zero, so the padding that keeps
      content clear of the Dynamic Island and the home indicator does nothing
      at all. It has to be here, not in the stylesheet.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      What the page says about itself before any script runs. lib/head
      rewrites the title, description, canonical and Open Graph tags on every
      navigation, in the interface language; these are what a crawler or a
      link preview sees first, and what they fall back to.
    -->
    <title>Thwart — Marvel Champions companion: cards, collection, decks, campaigns</title>
    <meta
      name="description"
      content="A free companion for Marvel Champions: The Card Game. Search every card, track your collection, build decks, draw a game, play the campaigns. Offline, no account."
    />
    <link rel="canonical" href="https://thwart.app/" />
    <meta name="robots" content="index, follow" />
    <!--
      Search Console ownership, the HTML-tag way. The same token sits in a
      DNS TXT record at OVH for the domain property; this one lets a
      URL-prefix property verify from the page alone. Not a secret: it only
      proves that whoever can edit this page also holds the Google account.
    -->
    <meta name="google-site-verification" content="5MyvJ9JfYrt2GpHqJmUs3HVUVFkwN9J_ehm0aOwfNk8" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thwart" />
    <meta property="og:title" content="Thwart — Marvel Champions companion" />
    <meta
      property="og:description"
      content="Search every card, track your collection, build decks, draw a random game, play the campaigns and keep your statistics. Free, offline, no account needed."
    />
    <meta property="og:url" content="https://thwart.app/" />
    <meta property="og:image" content="https://thwart.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thwart — Marvel Champions companion" />
    <meta
      name="twitter:description"
      content="Search every card, track your collection, build decks, draw a random game, play the campaigns and keep your statistics. Free, offline, no account needed."
    />
    <meta name="twitter:image" content="https://thwart.app/og-image.png" />
    <!--
      Structured data, so a search engine knows this is a free web
      application and not a shop or an article. A data block, not a script:
      the content security policy's script-src does not apply to it, since
      nothing here executes.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Thwart",
        "alternateName": "Thwart, a Marvel Champions companion",
        "url": "https://thwart.app/",
        "description": "A free companion for Marvel Champions: The Card Game. Search every card in English or French, track your collection, build legal decks, draw a random game, play the nine campaigns and keep your statistics. Works offline, no account needed.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["en", "fr"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "about": {
          "@type": "Game",
          "name": "Marvel Champions: The Card Game",
          "publisher": { "@type": "Organization", "name": "Fantasy Flight Games" }
        },
        "sameAs": ["https://github.com/Hasyame/Thwart"]
      }
    </script>
    <meta name="color-scheme" content="light dark" />
    <!-- The app's own mark. See web/public/icon.svg. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
<!--
      The browser chrome and, on iOS, the area behind the status bar. It
      follows the surface the page actually paints, so an installed app does
      not sit a red band above a near-black screen.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F1EF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0B0C" />

    <!--
      Installable on a phone. Android reads the manifest; iOS reads almost none
      of it and wants these three tags instead, including a PNG it will not
      substitute an SVG for.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      `black-translucent` puts the web view under the status bar, which is what
      makes the app look native. It only works with the safe-area padding
      above: without both, the first line of every screen sits under the clock.
    -->
    <meta name="apple-mobile-web-app-title" content="Thwart" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Card images are referenced from MarvelCDB at their canonical URLs and are
      never copied here. Warming the connection early keeps the first card view
      from paying for a fresh TLS handshake.
    -->
    <link rel="preconnect" href="https://marvelcdb.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
