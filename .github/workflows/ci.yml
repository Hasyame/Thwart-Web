name: CI

# Proves the code builds and the tests pass. It does not deploy, and it does
# not publish the built site.
#
# **Why no artifact.** The build output is 18 MB, and 17.7 MB of that is
# Fantasy Flight's card text fetched from MarvelCDB. Uploading it would be
# re-hosting somebody else's copyrighted material, which this project does not
# do anywhere else; the repository refuses to commit the same data for the same
# reason. The server fetches its own copy straight from MarvelCDB.
#
# **Why no schedule.** The nightly refresh belongs to the server, which is the
# only machine that needs the result. Running it here as well meant two fetches
# from a volunteer-run site every night to produce the same answer twice.
#
# **Why the card data is cached rather than fetched every push.** It is the
# whole database in both languages, from a volunteer-run site, and it moves in
# weeks rather than hours. The cache key is the fetching script, so a change to
# that refetches; otherwise the data is reused until GitHub evicts it, which it
# does after a week unused. Use the manual trigger to force a fetch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fetchCardData:
        description: "Also fetch from MarvelCDB, to exercise the fetching code"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build

      # The palette is the one place "it looks fine" is not evidence. The
      # scheme this replaced failed seven pairs while looking reasonable to
      # everyone who shipped it, so the thresholds are asserted instead.
      - name: Contrast and touch targets
        working-directory: web
        run: npm run test:contrast

      # There is no dirty flag in this app: a record counts as changed when its
      # body hashes differently from what the server last confirmed. That is
      # immune to a write that forgets to mark a row, and entirely dependent on
      # the digest being right, so the digest is asserted.
      - name: Sync change detection
        working-directory: web
        run: npm run test:sync

      # Pull, merge, push, on the cases that lose data rather than the happy
      # one: a batch that fails and the ones behind it that must not be sent, a
      # push whose own revisions must not be read straight back down, and the
      # gap in them that means another device wrote and must not be stepped
      # over. The engine takes its world as an argument so these can be built
      # without a browser.
      - name: Sync engine
        working-directory: web
        run: npm run test:engine-sync

      # A play can be set aside: kept, and left out of the numbers. The failure
      # is silent — a filter applied to the headline and not to the tables
      # gives a page whose rows do not add up to their own heading, and nobody
      # reads it closely enough to notice for months.
      - name: Plays and statistics
        working-directory: web
        run: npm run test:plays

      # The refinements the server does not know about. It applies
      # last-write-wins to whole records and never reads a body, so each of
      # these lives in the client, and a client that skips one loses what the
      # other kept — silently, and in one case outside the app entirely: a
      # stale reportedToBgg posts a duplicate to a real BoardGameGeek account.
      - name: Sync merge rules
        working-directory: web
        run: npm run test:merge

      - name: Service worker routing
        working-directory: web
        run: npm run test:sw

      # Both shapes the Android app exports: plain JSON, and a zip holding
      # backup.json. The archive fixture is built by the test, so no binary
      # lives in the repository.
      - name: Backup import
        working-directory: web
        run: npm run test:backup

      # The app started carrying its preferences in 1.39.0. Dropping them here
      # would break a round trip silently: a phone reading a file with no
      # settings leaves its own alone, so nothing looks wrong.
      - name: Backup settings
        working-directory: web
        run: npm run test:settings

      # The card data, cached.
      #
      # The tracker tests are the most valuable in the repository, because they
      # cover rules ported from the Android app, and they are only worth
      # anything against the real card database: this data spells "per player"
      # two contradictory ways, and a hand-written fixture gets that wrong in
      # the same direction as the code.
      #
      # Cached rather than fetched every push. The key is the fetching script,
      # so the cache survives until that changes, and GitHub evicts what has
      # not been used for a week. MarvelCDB is run by volunteers and the card
      # database moves in weeks, not hours.
      - name: Restore card data
        id: cards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/public/data
          key: data-${{ hashFiles('web/scripts/fetch-cards.mjs', 'web/scripts/fetch-campaigns.mjs') }}

      - name: Fetch card data
        if: steps.cards.outputs.cache-hit != 'true' || inputs.fetchCardData
        working-directory: web
        run: npm run data

      # The campaigns, always, cache hit or not.
      #
      # The cache key is the fetching scripts, which is right for the card
      # database — 17.7 MB from a volunteer-run site that moves in weeks. It is
      # wrong for the campaigns: those come from the Android repository, change
      # when somebody edits a template there, and the script that fetches them
      # does not change with them. A cached copy therefore went stale
      # indefinitely, and the tracker tests were asserting against data this
      # runner did not have. Nine files and a couple of seconds.
      - name: Fetch campaign templates
        working-directory: web
        run: npm run campaigns

      - name: Encounter tracker
        working-directory: web
        run: npm run test:encounter

      - name: Paused games
        working-directory: web
        run: npm run test:paused

      # The setup text is Fantasy Flight's, read off the cards at runtime and
      # never committed here, so the only way to test the parser is against the
      # real database. Both languages, because the heading is spelled three
      # ways across them.
      - name: Scenario setup text
        working-directory: web
        run: npm run test:setup

      # The evaluator, plus a sweep asserting that every key in all nine
      # templates is declared in the port. A key that is not declared is not a
      # type error: it is silently dropped, and the rule it expressed stops
      # happening several scenarios later.
      - name: Campaign conditions
        working-directory: web
        run: npm run test:campaign

      # Without a backup this runs the synthetic half only, which is where the
      # op-token regression guard lives. The real runs are folded locally,
      # where somebody's private campaign log is allowed to be.
      - name: Campaign engine
        working-directory: web
        run: npm run test:engine

      # A placeholder that does not resolve prints a card code in the middle of
      # a sentence, and nothing errors. So this sweeps every one in all nine
      # templates rather than only checking the parser.
      - name: Campaign text
        working-directory: web
        run: npm run test:text

      # The draws the app makes for the players, and the same shape of guard as
      # the op tokens: a question spelled the way the templates spell it has to
      # match, or it is never asked and the campaign quietly diverges.
      - name: Campaign draws and questions
        working-directory: web
        run: npm run test:deal

      # Fear No Evil's villains are on no database, so its numbers come from
      # the template. Asserted against the real one: the stages a difficulty
      # plays, the threat pressure already put on a job, and the scheme a
      # scenario deals to each player rather than to the table.
      - name: Campaign tracker
        working-directory: web
        run: npm run test:tracker


  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Formatting
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # With the race detector, which is the only reason the concurrency tests
      # exist. It needs cgo, and therefore a C compiler; the runner has one,
      # which is more than can be said for every development machine.
      - name: Test
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  # --- the release marker ----------------------------------------------------
  #
  # Moves the `release` branch to this commit once both halves are green.
  #
  # This is the whole of the deployment handshake, and it is deliberately not a
  # deployment. Nothing here reaches the server, holds a credential for it, or
  # knows it exists: the branch is a statement that a commit passed, and the
  # server decides on its own timer what to do about that. The alternative —
  # an SSH key in GitHub Actions — would give anyone with write access to this
  # repository, and every third-party action that ever runs in it, a shell on
  # the machine holding the account database. A branch pointer cannot do that.
  #
  # The push is a fast-forward, because that is git's default and this job does
  # not pass --force. A force-push to main therefore fails here loudly instead
  # of quietly marking rewritten history as tested.
  release:
    name: Mark tested
    needs: [web, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move release to this commit
        run: |
          git push origin "${{ github.sha }}:refs/heads/release"
          echo "release -> $(git rev-parse --short "${{ github.sha }}")" >> "$GITHUB_STEP_SUMMARY"
