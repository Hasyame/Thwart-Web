# /etc/nginx/sites-available/thwart.app
#
# A static site, so nginx does all of it. No application server, no proxy pass.
#
# Certbot rewrites this file when it installs the certificate: it adds the
# listen 443 lines, the ssl_certificate paths and the port 80 redirect. What is
# below is what to put here first, before running it.

server {
    listen 80;
    listen [::]:80;
    server_name thwart.app www.thwart.app;

    root /srv/thwart/current;
    index index.html;

    # .app is in the HSTS preload list as a whole TLD, so browsers refuse plain
    # HTTP to this name whatever we serve. Certbot still needs port 80 for the
    # http-01 challenge, which Let's Encrypt validates itself and does not
    # enforce preloading against.

    # ---- compression -------------------------------------------------------
    # The search index is 1.1 MB of JSON and compresses to about a fifth of
    # that. Without this, every first visit pays for the whole thing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- caching -----------------------------------------------------------
    # Three rules, matching what the service worker does, for the browsers and
    # the first visits that have no worker yet.

    # Hashed by the build, so the name changes whenever the contents do.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rewritten nightly *without* changing name. Must be revalidated, or a
    # reader is pinned to the card database they first downloaded. nginx sends
    # ETag and Last-Modified, so a revalidation that finds nothing new is a
    # cheap 304 rather than a re-download.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The worker decides what everything else does, so it must never be stale
    # itself: a cached sw.js is a deployment that never lands.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- headers -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Belt and braces: the TLD is preloaded, but a header costs nothing and
    # covers anything that does not consult the preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- routing -----------------------------------------------------------
    # Every client-side route is the same document. Without this, /decks and
    # /card/01001a are 404s on a hard refresh, which is exactly what a person
    # does when they bookmark a card.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Card data is fetched from MarvelCDB at build time and card images are
    # referenced at their canonical URLs. Nothing here proxies either.
}
