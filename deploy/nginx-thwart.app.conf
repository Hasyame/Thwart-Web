# /etc/nginx/sites-available/thwart.app
#
# A static site, so nginx does all of it. No application server, no proxy pass.
#
# Certbot rewrites this file when it installs the certificate: it adds the
# listen 443 lines, the ssl_certificate paths and the port 80 redirect. What is
# below is what to put here first, before running it.
#
# **After that, this file is a reference, not something to copy over the live
# one.** Copying it back removes everything certbot added and takes HTTPS
# down (it did, 2026-09-13). Carry a change into the live file by hand and
# reload; docs/deployment.md section 5 has the steps.

# ---- shedding load before it costs anything --------------------------------
#
# `limit_req_zone` and `map` belong at http level, so they live in
# /etc/nginx/conf.d/thwart-limits.conf, which deploy/harden.sh installs. They are
# written out here as well so the whole policy for this site reads in one place:
#
#   map $request_uri $thwart_auth_key {
#       default        "";
#       ~^/api/v1/auth/ $binary_remote_addr;
#   }
#   limit_req_zone $thwart_auth_key zone=thwart_auth:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=thwart_api:10m rate=600r/m;
#   limit_req_status 429;
#
# The application limits attempts per address and caps how many password hashes
# run at once, and those are the real defence. This is the cheaper layer in
# front: a request refused here costs microseconds of nginx rather than a
# goroutine, a database lookup and a decision about 64 MiB of Argon2.
#
# **The map is what keeps the tight limit off sync.** A single `limit_req` on
# /api/ would apply the authentication rate to everything, and ten requests a
# minute would break syncing outright — a first adoption is a page of pulls and
# a batch at a time of pushes. An empty key means nginx does not apply the zone
# at all, so only /api/v1/auth/* is counted against the strict one. The loose
# zone is ten requests a second, far above any real client and far below
# anything worth calling a flood.

server {
    listen 80;
    listen [::]:80;
    server_name thwart.app www.thwart.app;

    root /srv/thwart/current;
    index index.html;

    # .app is in the HSTS preload list as a whole TLD, so browsers refuse plain
    # HTTP to this name whatever we serve. Certbot still needs port 80 for the
    # http-01 challenge, which Let's Encrypt validates itself and does not
    # enforce preloading against.

    # ---- compression -------------------------------------------------------
    # The search index is 1.1 MB of JSON and compresses to about a fifth of
    # that. Without this, every first visit pays for the whole thing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- caching -----------------------------------------------------------
    # Three rules, matching what the service worker does, for the browsers and
    # the first visits that have no worker yet.

    # Hashed by the build, so the name changes whenever the contents do.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/thwart-security.conf;
        try_files $uri =404;
    }

    # Rewritten nightly *without* changing name. Must be revalidated, or a
    # reader is pinned to the card database they first downloaded. nginx sends
    # ETag and Last-Modified, so a revalidation that finds nothing new is a
    # cheap 304 rather than a re-download.
    location /data/ {
        add_header Cache-Control "no-cache";
        include snippets/thwart-security.conf;
        try_files $uri =404;
    }

    # The worker decides what everything else does, so it must never be stale
    # itself: a cached sw.js is a deployment that never lands.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include snippets/thwart-security.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/thwart-security.conf;
    }

    # nginx's stock mime.types has no entry for .webmanifest, so it goes out as
    # application/octet-stream and a browser will not treat it as a manifest at
    # all: the site stops being installable, silently and with a 200.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include snippets/thwart-security.conf;
    }

    # ---- headers -----------------------------------------------------------
    # ---- security headers --------------------------------------------------
    #
    # In a snippet, and repeated into every location below, because nginx
    # *replaces* the inherited set the moment a location declares an add_header
    # of its own rather than adding to it.
    #
    # That is not a theoretical footnote. This site served no HSTS, no nosniff
    # and no referrer policy at all until it was measured: /assets/, /data/,
    # /sw.js, /index.html and the manifest each set a Cache-Control and thereby
    # dropped every header declared here. `/` was in that set too, because
    # `try_files ... /index.html` matches `location = /index.html`. The comment
    # in the /api/ block had warned about exactly this and the trap was live
    # everywhere else.
    #
    # So: any new location that sets an add_header must also include the
    # snippet. There is no way to make nginx inherit.
    include snippets/thwart-security.conf;

    # ---- content security policy -------------------------------------------
    #
    # Derived from what the app actually loads, not from a template. The build
    # emits no inline <script> and no inline <style>, so scripts are 'self' with
    # neither unsafe-inline nor unsafe-eval — which is the directive that
    # actually stops an injected string from becoming code.
    #
    # Styles need 'unsafe-inline' and there is no way around it: Svelte compiles
    # `style:width={...}` into a style attribute, and the statistics bars are
    # drawn that way. style-src-attr would be the narrower rule but is not
    # carried everywhere, and a policy that silently flattens every bar chart on
    # one browser is worse than the risk it removes. Injected CSS is a far
    # smaller problem than injected script.
    #
    # marvelcdb.com is named twice over: img-src because card images are hot-
    # linked and never re-hosted, connect-src because importing a deck fetches
    # their public API. fr.marvelcdb.com serves the French card text.
    # Belt and braces: the TLD is preloaded, but a header costs nothing and
    # covers anything that does not consult the preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- the API -----------------------------------------------------------
    # The account server listens on loopback only; this is the sole way in.
    #
    # Mounted at /api/ so the paths the server itself defines stay exactly as
    # doc 02 writes them: /api/v1/health reaches the server as /v1/health. An
    # instance that prefers a separate hostname can proxy / instead and change
    # nothing else.
    # ---- the live sync stream ----------------------------------------------
    #
    # Before /api/, because nginx takes the longest matching prefix and this one
    # needs different timeouts from every other endpoint.
    #
    # An SSE response never ends. `proxy_read_timeout` is what closes an idle
    # upstream, and the 60s used for the rest of the API would drop a quiet
    # stream every minute — which still works, because the client reconnects and
    # catches up, but it turns a live feature into a poll. The server sends a
    # comment every 20 seconds, so even a self-hoster who leaves the default is
    # only ever disconnected when something else has gone wrong.
    #
    # `proxy_buffering off` is the one people miss: with buffering on, nginx
    # holds events until its buffer fills, and the feature looks broken rather
    # than slow. The handler also sends `X-Accel-Buffering: no` so this is true
    # twice.
    location /api/v1/sync/stream {
        proxy_pass http://127.0.0.1:8787/v1/sync/stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An SSE connection is not a keep-alive candidate; clearing this stops
        # nginx trying to reuse the upstream socket underneath it.
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # No access log for this location, and it is not optional.
        #
        # `EventSource` cannot send an Authorization header, so this is the one
        # route whose token travels in the query string — and the access log
        # records the full request line. Logging it would write a live
        # credential into a plaintext file on every connect, which is exactly
        # what the tw_live_ prefix exists to make greppable after a leak.
        #
        # Errors are still logged; it is only the request line that is dropped,
        # and a stream that fails does so through the API's own logging.
        access_log off;

        include snippets/thwart-security.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # The stream is opened once per browser and held. It must not be counted
        # against the authentication burst, or a reconnect storm after a network
        # blip would lock everybody out of signing in.
        limit_req zone=thwart_api burst=100 nodelay;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # The rate limiter reads these. Without them every request arrives from
        # 127.0.0.1 and the whole internet shares one bucket, which locks
        # everybody out together.
        #
        # $remote_addr and NOT $proxy_add_x_forwarded_for. The latter appends
        # the real peer to whatever the caller sent, so a request carrying
        # "X-Forwarded-For: 198.51.100.1" arrives as
        # "198.51.100.1, 203.0.113.7" and anything reading the list from the
        # left is reading a value the caller chose. That was measured against
        # this server: eight registrations against a limit of five, none
        # refused, each with a different invented prefix.
        #
        # Replacing the header means the caller's copy never reaches the
        # application at all. The application also reads the list from the
        # right, so neither layer alone is load-bearing.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Argon2id at 64 MiB is deliberately slow, and a login runs one. The
        # default 60s read timeout is already generous; this says so on
        # purpose so nobody trims it to something that breaks logins under
        # load.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Every response here is a credential or account state. The server
        # sends no-store itself; this stops nginx caching on its own account.
        proxy_buffering off;

        # add_header in a location replaces the server-level ones rather than
        # adding to them, so the security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        # Every response here is JSON. Nothing should ever be loaded from it, so
        # the policy is the empty one rather than the site's.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # Both zones apply. thwart_auth has an empty key for anything that is
        # not an authentication path, and an empty key means nginx skips the
        # zone, so this pair is "strict on /api/v1/auth/*, loose on the rest".
        # burst=20, not 5. The sustained rate is what bounds a brute force;
        # the burst only decides how big a legitimate flurry may be, and 5 was
        # measured to be too mean — a scripted register-confirm-sign-in run
        # tripped it, and so would two people signing in from one office or
        # anybody behind a mobile carrier's NAT.
        #
        # Nothing is lost by widening it. The application's own per-address
        # limit is 30 in 15 minutes, which is *tighter* than this zone's
        # sustained 10 a minute, so nginx is the cheap outer layer and not the
        # binding constraint. What it buys is that a flood costs microseconds of
        # nginx rather than a goroutine and a decision about 64 MiB of Argon2.
        #
        # Known limitation, shared with the application's limiter and not solved
        # here: several people behind one address share a budget. On a
        # carrier-grade NAT that is a lot of people. Fixing it properly means
        # limiting per account rather than per address, which cannot be done
        # before the credentials are read.
        #
        # nodelay so somebody who mistypes twice is served at once rather than
        # queued.
        limit_req zone=thwart_auth burst=20 nodelay;
        limit_req zone=thwart_api burst=100 nodelay;
    }

    # ---- routing -----------------------------------------------------------
    # Every client-side route is the same document. Without this, /decks and
    # /card/01001a are 404s on a hard refresh, which is exactly what a person
    # does when they bookmark a card.
    #
    # But only the routes the app has. Anything else used to come back 200
    # with the home page, and a search engine indexes a 200 as a page: every
    # mistyped or stale link became a copy of the home page under an address
    # of its own. Those paths now answer 404 -- still with the document, so
    # the app can say what happened and offer the way back -- and the status
    # is what a crawler reads. The list is the router's (web/src/lib/router.ts,
    # the *_PATH constants); a route added there has to be added here, or its
    # deep links refresh into a 404 page that says the address is unknown.
    location ~ ^/(card|collection|randomizer|versus|decks|play|hub|stats|campaigns|rules|account|settings|verify|history)(/|$) {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }

    # Card data is fetched from MarvelCDB at build time and card images are
    # referenced at their canonical URLs. Nothing here proxies either.
}
