# Written by deploy/harden.sh. The site's security headers, in one place.
#
# Included by every location that sets an add_header of its own, because
# nginx replaces the inherited set rather than adding to it. A location
# that sets Cache-Control and nothing else is a location serving no
# security headers at all, which is how this site ran until it was
# measured.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
# Features the site never uses, switched off for it and anything it might
# load. Not screen-wake-lock: the play screen keeps the phone awake. Not
# clipboard: decks are copied. (Black-box audit, 2026-09-24.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=()" always;
# A page opened from here gets no handle back on this window, and the reverse.
# The BGG hand-off opens BGG in a new tab and needs nothing from it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Nothing here is meant to be embedded by another site.
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Card pictures come from MarvelCDB, and from MC4DB and cgbuilder for French
# scans and the cards MarvelCDB has none of (web/src/lib/cardImages.ts).
# The CSP is the control that makes a bearer token in the page's storage
# acceptable: script-src 'self' and no inline script. Loosening script-src is
# a security regression, whatever the feature. style-src keeps 'unsafe-inline'
# because Svelte writes style attributes; that is styles only.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://marvelcdb.com https://fr.marvelcdb.com https://mc4db.merlindumesnil.net https://mc-src.cgbuilder.fr; connect-src 'self' https://marvelcdb.com https://fr.marvelcdb.com; font-src 'self'; worker-src 'self'; manifest-src 'self'" always;
