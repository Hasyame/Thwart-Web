# Written by deploy/harden.sh. The site's security headers, in one place.
#
# Included by every location that sets an add_header of its own, because
# nginx replaces the inherited set rather than adding to it. A location
# that sets Cache-Control and nothing else is a location serving no
# security headers at all, which is how this site ran until it was
# measured.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://marvelcdb.com https://fr.marvelcdb.com; connect-src 'self' https://marvelcdb.com https://fr.marvelcdb.com; font-src 'self'; worker-src 'self'; manifest-src 'self'" always;
