# Installed by deploy/harden.sh. Rate limiting, at http level because that is
# the only scope where limit_req_zone and map are allowed.
#
# See the long note in the site config for why the auth zone is keyed through a
# map: an empty key makes nginx skip the zone entirely, which is how the strict
# authentication rate is kept off /api/v1/sync. A single limit_req on /api/
# would apply ten-a-minute to syncing and break it.

map $request_uri $thwart_auth_key {
    default         "";
    ~^/api/v1/auth/ $binary_remote_addr;
}

limit_req_zone $thwart_auth_key zone=thwart_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=thwart_api:10m rate=600r/m;

# 429, not the default 503: this is the caller being told to slow down, and the
# clients already understand that code.
limit_req_status 429;

# The access log, without query strings.
#
# The default format writes the whole request line, and some of this site's
# URLs carry a secret in the query: the address-confirmation link
# (/verify?token=...) did land in the log before this. The path is kept for
# reading traffic; the query is dropped for every request, so no future URL
# can bring the problem back. Taken from $request_uri rather than $uri,
# because the SPA's try_files rewrites $uri to /index.html. Used by the
# access_log lines in the site config (black-box audit, 2026-09-24).
map $request_uri $thwart_log_path {
    default            $request_uri;
    "~^(?<path>[^?]*)" $path;
}

log_format thwart '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $thwart_log_path $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
