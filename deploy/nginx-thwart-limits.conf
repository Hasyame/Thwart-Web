# Installed by deploy/harden.sh. Rate limiting, at http level because that is
# the only scope where limit_req_zone and map are allowed.
#
# See the long note in the site config for why the auth zone is keyed through a
# map: an empty key makes nginx skip the zone entirely, which is how the strict
# authentication rate is kept off /api/v1/sync. A single limit_req on /api/
# would apply ten-a-minute to syncing and break it.

map $request_uri $thwart_auth_key {
    default         "";
    ~^/api/v1/auth/ $binary_remote_addr;
}

limit_req_zone $thwart_auth_key zone=thwart_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=thwart_api:10m rate=600r/m;

# 429, not the default 503: this is the caller being told to slow down, and the
# clients already understand that code.
limit_req_status 429;
